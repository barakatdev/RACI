<script>
/* ================================================================
   حزمة v8 — تصحيحات + خصوصية + الاجتماعات + أشكال ومحرر الهيكل
   الجزء 1 من 3
   ================================================================ */

/* ================== أولاً: تصحيح الأعطال ================== */

/* (1) فصل «نموذج التكليف» عن أمر «تكليف جديد» */
TABS[2].sub = ["سجل التكليفات", "خطابات التكليف", "نموذج التكليف"];

/* (2) تنقّل نظيف — التبويب الثالث لم يعد يُختطف */
function go(i, s) {
  var t = TABS[i]; if (!t) return;
  if (t.adm && ME && ME.role !== "مدير النظام") { alert("هذا القسم لمدير النظام فقط"); return; }
  CURT = i; CURS = (s == null ? 0 : s);
  for (var k = 0; k < TABS.length; k++) { var b = $("tb" + k); if (b) b.classList.toggle("on", k === i); }
  ALLP.forEach(function (p) { var el = $(p); if (el) el.classList.remove("on"); });
  var sb = $("subbar");
  if (!sb) {                                   /* إنشاء شريط التبويبات الفرعية إن كان مفقوداً */
    sb = document.createElement("div"); sb.id = "subbar"; sb.className = "row";
    sb.style.cssText = "display:none;gap:6px;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px";
    var mn = document.querySelector("main"); if (mn) mn.insertBefore(sb, mn.firstChild);
  }
  if (t.sub) {
    if (CURS >= t.p.length) CURS = 0;
    sb.style.display = "flex";
    sb.innerHTML = t.sub.map(function (x, n) {
      return '<button class="btn btn-s' + (n === CURS ? " on" : "") + '" onclick="go(' + i + ',' + n + ')">' + x + '</button>';
    }).join("");
    $(t.p[CURS]).classList.add("on");
  } else { sb.style.display = "none"; $(t.p[0]).classList.add("on"); }
  var cur = t.sub ? t.p[CURS] : t.p[0];
  if (cur === "p3") renderDoc();
  if (cur === "p4") { renderLetters(); renderLetter(); }
  if (cur === "p5") { renderTasks(); renderMeets(); renderMinutes(); }
  applyLock(); window.scrollTo(0, 0);
}

/* (3) زر «📄 النموذج» كان يفتح دليل الوظائف */
function gotoDoc(i) { go(2, 2); var s = $("selEmp"); if (s) { s.value = i; renderDoc(); } }

/* (4) نافذة «تحديد الحضور والأدوار» كانت تتعطّل بعد «تحضير الأعضاء» */
function openMembers() {
  if (!guard()) return;
  renderMembersModal();
  var m = DB.meets[+$("selMeet").value]; if (!m) { alert("اختر اجتماعاً"); return; }
  var op = function (v) { return DB.emps.map(function (e) { return '<option' + (v === e.name ? " selected" : "") + '>' + esc(e.name) + '</option>'; }).join(""); };
  $("mbChair").innerHTML = '<option value=""></option>' + op(m.chair);
  $("mbSec").innerHTML = '<option value=""></option>' + op(m.sec);
  $("mbMembers").innerHTML = DB.emps.map(function (e) {
    return '<option' + (((m.members || []).indexOf(e.name) >= 0) ? " selected" : "") + '>' + esc(e.name) + '</option>';
  }).join("");
  $("mbGuests").value = m.guests || "";
  $("mb").classList.add("on");
}

/* (5) الضيوف يدخلون في التحضير ولا يُحتسبون حاضرين تلقائياً */
function attList(m) {
  var a = (m.members || []).slice();
  if (m.guests) String(m.guests).split(/[،,]/).forEach(function (x) { x = x.trim(); if (x && a.indexOf(x) < 0) a.push(x); });
  return a;
}

/* (6) إغلاق النوافذ بالضغط خارجها أو بمفتاح Esc */
["wz", "sk", "mb"].forEach(function (id) {
  var el = $(id); if (!el || el.getAttribute("data-esc")) return;
  el.setAttribute("data-esc", "1");
  el.addEventListener("click", function (ev) {
    if (ev.target !== el) return;
    if (id === "mb") renderMembersModal();
    el.classList.remove("on");
  });
});
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Escape") return;
  ["wz", "sk", "mb"].forEach(function (id) {
    var el = $(id); if (!el || !el.classList.contains("on")) return;
    if (id === "mb") renderMembersModal();
    el.classList.remove("on");
  });
});

/* ================== ثانياً: الخصوصية وحماية الحسابات ================== */

var SEC = { idleMin: 20, defaults: ["admin123", "123456"] };

function _hex(buf) {
  return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
}
function newSalt() {
  if (window.crypto && crypto.getRandomValues) { var a = new Uint8Array(16); crypto.getRandomValues(a); return _hex(a.buffer); }
  return String(Date.now()) + Math.random().toString(16).slice(2);
}
function pwHash(pw, salt) {
  var txt = salt + "|" + String(pw);
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt))
      .then(function (d) { return "s256:" + _hex(d); })
      .catch(function () { return _weak(txt); });
  }
  return Promise.resolve(_weak(txt));
}
function _weak(s) { var h = 5381, i; for (i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return "fb:" + h.toString(16); }

/* ترحيل الحسابات: تحويل كلمات المرور النصية إلى بصمات مملَّحة وحذف الأصل */
function migrateUsers() {
  var jobs = store.users.map(function (u) {
    if (u.h) return Promise.resolve(false);
    var plain = u.p == null ? "" : String(u.p);
    u.s = newSalt();
    if (SEC.defaults.indexOf(plain) >= 0) u.chg = 1;      /* كلمة مرور افتراضية → إلزام التغيير */
    return pwHash(plain, u.s).then(function (h) { u.h = h; delete u.p; return true; });
  });
  return Promise.all(jobs).then(function (r) {
    if (r.some(Boolean)) { persist(); if (typeof renderUsers === "function" && $("tUsers")) renderUsers(); }
  });
}
/* تسجيل الدخول بالمقارنة على البصمة */
function doLogin() {
  var u = $("lu").value.trim(), p = $("lp").value;
  var f = store.users.filter(function (x) { return x.u === u && x.active !== "لا"; })[0];
  if (!f) { $("lerr").textContent = "بيانات الدخول غير صحيحة أو الحساب موقوف"; return; }
  var chk = f.h ? pwHash(p, f.s).then(function (h) { return h === f.h; }) : Promise.resolve(String(f.p) === p);
  chk.then(function (ok) {
    if (!ok) { $("lerr").textContent = "بيانات الدخول غير صحيحة أو الحساب موقوف"; return; }
    ME = f; try { sessionStorage.setItem("gov_me", u); } catch (e) { }
    $("login").style.display = "none"; $("lerr").textContent = ""; $("lp").value = "";
    boot(); armIdle();
    if (f.chg) setTimeout(function () { changePw(userIndex(f.u), true); }, 300);
  });
}
function userIndex(u) { for (var i = 0; i < store.users.length; i++) if (store.users[i].u === u) return i; return -1; }

/* تغيير كلمة المرور (حلقة وليست استدعاءً متكرراً) */
function changePw(i, force) {
  var u = store.users[i]; if (!u) return;
  if (!force && !can("edit")) { alert("لا تملك صلاحية التعديل"); return; }
  var pw = null, ok = false, tries = 0;
  while (tries < 6) {
    tries++;
    pw = prompt((force && tries === 1 ? "كلمة المرور الحالية افتراضية — يجب تغييرها.\n\n" : "") + "كلمة المرور الجديدة لحساب «" + u.u + "» (٨ أحرف فأكثر):");
    if (pw === null) { if (force) alert("لن تُحفظ بياناتك بأمان قبل تغيير كلمة المرور."); return; }
    if (String(pw).length < 8) { alert("كلمة المرور قصيرة — ٨ أحرف على الأقل."); continue; }
    if (prompt("أعد كتابة كلمة المرور للتأكيد:") !== pw) { alert("الكلمتان غير متطابقتين."); continue; }
    ok = true; break;
  }
  if (!ok) { alert("لم يتم تغيير كلمة المرور."); return; }
  u.s = newSalt();
  pwHash(pw, u.s).then(function (h) { u.h = h; delete u.p; delete u.chg; persist(); renderUsers(); msg("تم تغيير كلمة المرور"); });
}

/* جدول المستخدمين بلا عرض كلمات المرور */
function renderUsers() {
  var h = '<colgroup><col style="width:36px"><col style="width:170px"><col style="width:210px"><col style="width:180px"><col style="width:180px"><col style="width:100px"><col style="width:42px"></colgroup>' +
    '<thead><tr><th>م</th><th>اسم المستخدم</th><th>الاسم الكامل</th><th>كلمة المرور</th><th>الدور</th><th>نشط</th><th></th></tr></thead><tbody>';
  store.users.forEach(function (u, i) {
    var badge = u.chg ? '<span class="chip c-bad">يجب تغييرها</span>' : (String(u.h || "").indexOf("s256:") === 0 ? '<span class="chip c-ok">مشفّرة</span>' : '<span class="chip c-warn">بصمة مبسطة</span>');
    h += '<tr><td style="text-align:center;color:#9aa">' + (i + 1) + '</td>' +
      '<td><input value="' + esc(u.u) + '" onchange="uU(' + i + ',\'u\',this.value)"></td>' +
      '<td><input value="' + esc(u.name) + '" onchange="uU(' + i + ',\'name\',this.value)"></td>' +
      '<td>' + badge + ' <button class="btn btn-o ed" style="padding:4px 9px" onclick="changePw(' + i + ')">🔑 تغيير</button></td>' +
      '<td><select onchange="uU(' + i + ',\'role\',this.value)">' + ROLES.map(function (v) { return '<option' + (u.role === v ? " selected" : "") + '>' + v + '</option>'; }).join("") + '</select></td>' +
      '<td><select onchange="uU(' + i + ',\'active\',this.value)">' + YN.map(function (v) { return '<option' + (u.active === v ? " selected" : "") + '>' + v + '</option>'; }).join("") + '</select></td>' +
      '<td>' + (store.users.length > 1 ? '<button class="btn btn-d ed" style="padding:5px 9px" onclick="dUser(' + i + ')">✕</button>' : '') + '</td></tr>';
  });
  $("tUsers").innerHTML = h + '</tbody>';
}

/* مستخدم جديد: كلمة مرور تُطلب فوراً ولا تُخزَّن نصاً */
function addUser() {
  if (!guard()) return;
  var name = prompt("اسم المستخدم (بالإنجليزية بدون مسافات):"); if (!name) return;
  name = name.trim();
  if (store.users.some(function (x) { return x.u === name; })) { alert("اسم المستخدم موجود مسبقاً"); return; }
  var pw = prompt("كلمة المرور (٨ أحرف فأكثر):"); if (pw === null) return;
  if (String(pw).length < 8) { alert("كلمة المرور قصيرة"); return; }
  var s = newSalt();
  pwHash(pw, s).then(function (h) {
    store.users.push({ u: name, s: s, h: h, name: "مستخدم جديد", role: "مطّلع", active: "نعم" });
    persist(); renderUsers(); applyLock(); msg("تمت إضافة المستخدم");
  });
}

/* قفل تلقائي عند الخمول */
var _idleT = null;
function armIdle() {
  clearTimeout(_idleT);
  if (!ME) return;
  _idleT = setTimeout(function () { if (ME) { logout(); alert("تم تسجيل الخروج تلقائياً بعد " + SEC.idleMin + " دقيقة من الخمول."); } }, SEC.idleMin * 60000);
}
["click", "keydown", "mousemove", "touchstart"].forEach(function (ev) {
  document.addEventListener(ev, function () { if (ME) armIdle(); }, { passive: true });
});

/* إخفاء بيانات الدخول الافتراضية من شاشة الدخول + تنبيه الخصوصية */
(function () {
  var box = document.querySelector("#login .lbox"); if (!box) return;
  var ps = box.querySelectorAll("p");
  for (var i = 0; i < ps.length; i++) if (ps[i].textContent.indexOf("افتراضياً") >= 0) ps[i].remove();
  if (!$("privNote")) {
    var d = document.createElement("div");
    d.id = "privNote";
    d.style.cssText = "font-size:11px;color:#6b7280;line-height:1.8;margin-top:10px;text-align:right;background:#f8fafc;border:1px solid #e5e9f2;border-radius:9px;padding:8px";
    d.innerHTML = "🔒 تُحفظ البيانات داخل هذا المتصفح فقط ولا تُرسل لأي خادم. لا تستخدم هذه النسخة على جهاز عام أو مشترك.";
    box.appendChild(d);
  }
})();

/* لوحة الخصوصية داخل الإعدادات */
(function () {
  var p9 = $("p9"); if (!p9 || $("privPanel")) return;
  var d = document.createElement("div");
  d.className = "panel"; d.id = "privPanel";
  d.innerHTML = '<div class="ph"><h2>🔒 الخصوصية وحماية البيانات</h2></div>' +
    '<div class="lockmsg" style="background:#fff7e0;border-color:#f0d98a;color:#7a5c00">' +
    '<b>هذه المنصة تعمل داخل المتصفح بالكامل.</b> البيانات تُخزَّن في <code>localStorage</code> على هذا الجهاز فقط، ولا تُرسل إلى أي خادم.<br>' +
    'شاشة الدخول تنظّم الاستخدام ولا تُعد حماية أمنية: من يملك الجهاز يستطيع قراءة البيانات المخزّنة. ' +
    'لذلك <b>لا تنشر نسخة تحتوي بيانات موظفين حقيقية على مستودع عام</b> — اجعل المستودع خاصاً (Private) أو انشر بيانات تجريبية فقط.' +
    '</div>' +
    '<div class="row">' +
    '<div class="fld"><label class="f">مدة القفل التلقائي عند الخمول (دقيقة)</label>' +
    '<input id="idleMin" type="number" min="1" value="' + SEC.idleMin + '" onchange="SEC.idleMin=Math.max(1,+this.value||20);armIdle();msg(\'تم تحديث مدة القفل\')"></div>' +
    '<div class="fld" style="display:flex;align-items:flex-end;gap:8px">' +
    '<button class="btn btn-o" onclick="exportJSON()">⬇ نسخة احتياطية قبل المسح</button>' +
    '<button class="btn btn-d ed" onclick="wipeDevice()">🗑 مسح كل البيانات من هذا الجهاز</button></div></div>';
  p9.appendChild(d);
})();

function wipeDevice() {
  if (!guard()) return;
  if (!confirm("سيُمسح كل شيء من هذا المتصفح: الشركات والموظفون والخطابات والمستخدمون.\nهل أخذت نسخة احتياطية؟")) return;
  if (prompt("للتأكيد اكتب: مسح") !== "مسح") { alert("أُلغيت العملية."); return; }
  try { localStorage.removeItem(KEY); sessionStorage.removeItem("gov_me"); } catch (e) { }
  location.reload();
}
/* تنبيه واضح بدل تعطّل صامت عند غياب مكتبة Excel (وضع دون إنترنت) */
(function () {
  if (typeof XLSX !== "undefined") return;
  ["xlsxAll", "xlsxOne", "dlTemplate", "xlsxImport"].forEach(function (fn) {
    window[fn] = function () { alert("مكتبة Excel لم تُحمَّل (تحتاج اتصالاً بالإنترنت). بقية أقسام المنصة تعمل طبيعياً، ويمكنك استخدام «⬇ JSON» كبديل للنسخ الاحتياطي."); };
  });
})();

/* ================== التشغيل ================== */
migrateUsers().then(function () {
  if (typeof ME !== "undefined" && ME) { renderUsers(); go(CURT || 0, 0); armIdle(); }
});

/* ================================================================

(function () { "use strict"; if (window.__V8) return; window.__V8 = 1;

/* ============ أدوات ============ */
function $(id) { return document.getElementById(id); }
function E(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function TD() { return new Date().toISOString().slice(0, 10); }
function dlCSV(name, rows) {

    return r.map(function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name + ".csv"; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}
window.dlCSV = dlCSV;

css(

/* ============ قوائم مرجعية ============ */
var COMS = ["مجلس الإدارة", "اللجنة التنفيذية", "لجنة المراجعة والالتزام", "لجنة المشتريات", "لجنة الجرد", "لجنة الترشيحات والمكافآت", "اجتماع تشغيلي", "اجتماع طارئ"];
var MROLE = ["رئيس الاجتماع", "نائب الرئيس", "عضو", "أمين السر", "مدعو (بدون تصويت)"];
var MATT = ["حاضر", "عن بُعد", "معتذر", "غائب"];
var DST = ["جديد", "قيد التنفيذ", "منجز", "متأخر"];

/* ============ ترحيل البيانات ============ */
function migrate() {
  if (!DB.meets) DB.meets = [];
  DB.meets.forEach(function (m, i) {
    if (!m.no) m.no = "MIN-" + new Date().getFullYear() + "-" + ("00" + (i + 1)).slice(-3);
    if (!m.com) m.com = COMS.indexOf(m.type) >= 0 ? m.type : COMS[1];
    if (m.time == null) m.time = "";
    if (m.place == null) m.place = "";
    if (!m.qr) m.qr = "half";
    if (!m.agenda) m.agenda = [];
    if (!m.decs) m.decs = [];
    if (m.notes == null) m.notes = "";
    if (!m.roster) {
      m.roster = [];
      var at = m.attend || {};
      function add(n, role) {
        if (!n || m.roster.some(function (x) { return x.name === n; })) return;
        var e = (DB.emps || []).filter(function (x) { return x.name === n; })[0];
        var j = e ? job(e.job) : null;
        m.roster.push({ name: n, unit: j ? j.d : "", role: role, vote: role !== "مدعو (بدون تصويت)", att: at[n] || "حاضر" });
      }
      add(m.chair, "رئيس الاجتماع"); add(m.sec, "أمين السر");
      (m.members || []).forEach(function (n) { add(n, "عضو"); });
      String(m.guests || "").split(/[،,]/).forEach(function (n) { n = n.trim(); if (n) add(n, "مدعو (بدون تصويت)"); });
    }
  });
  (DB.jobs || []).forEach(function (j) { if (j.v == null) j.v = 1; });
  if (!DB._jobsBase) DB._jobsBase = JSON.parse(JSON.stringify(DB.jobs || []));
  persist();
}

/* ============ النصاب ============ */
function quorum(m) {
  var r = m.roster || [];
  var voters = r.filter(function (x) { return x.vote; }).length;
  var pres = r.filter(function (x) { return x.vote && (x.att === "حاضر" || x.att === "عن بُعد"); }).length;
  var need = m.qr === "two3" ? Math.ceil(voters * 2 / 3) : Math.floor(voters / 2) + 1;
  return { voters: voters, pres: pres, need: need, ok: voters > 0 && pres >= need };
}
window.v8Quorum = quorum;

/* ============ تبويب الاجتماعات ============ */
var MCUR = 0;
function buildSection() {
  if ($("pm")) return;

window.v8ToTasks = function () {
